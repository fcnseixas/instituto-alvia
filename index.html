<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instituto Alvia — Em breve</title>
<meta name="description" content="O novo site do Instituto Alvia — Educação Especializada está chegando. Fale com a gente pelo WhatsApp ou e-mail.">
<!-- Página temporária de construção. Não indexar enquanto o site oficial não sobe. -->
<meta name="robots" content="noindex,follow">

<link rel="icon" href="img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="img/favicon.png" sizes="300x300" type="image/png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Instituto Alvia">
<meta property="og:title" content="Instituto Alvia — Em breve">
<meta property="og:description" content="O novo site do Instituto Alvia — Educação Especializada está chegando.">
<meta property="og:url" content="https://institutoalvia.com.br/">
<meta property="og:image" content="https://institutoalvia.com.br/img/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="pt_BR">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
@font-face{
  font-family:"Hey Comic";
  src:url("fonts/HeyComic.woff2") format("woff2"),
      url("fonts/HeyComic.ttf") format("truetype");
  font-weight:400 700;
  font-style:normal;
  font-display:swap;
  /* mesma faixa do site: números e ":" caem para Montserrat */
  unicode-range:U+0020-002F, U+003F-024F;
}

:root{
  --navy:#2F5C7C;
  --ink:#16303F;
  --terra:#C06C50;
  --terra-soft:#E08A66;
  --cream:#FBF7F1;

  --font-body:"Montserrat",system-ui,-apple-system,sans-serif;
  --font-display:"Hey Comic","Montserrat",system-ui,sans-serif;

  --img-hero:url("https://images.unsplash.com/photo-1617117206620-b01f2919ff86?auto=format&fit=crop&w=2400&q=70");
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:var(--font-body);color:#fff;
  background:
    linear-gradient(180deg,rgba(22,48,63,.72),rgba(22,48,63,.88)),
    var(--img-hero) center 45%/cover no-repeat fixed;
  -webkit-font-smoothing:antialiased;
}

.hero{
  min-height:100svh;display:flex;align-items:center;justify-content:center;
  padding:48px 22px;text-align:center;
}
.inner{width:100%;max-width:600px;display:flex;flex-direction:column;align-items:center;gap:0}

.logo{
  width:min(230px,64vw);height:auto;margin-bottom:30px;
  filter:brightness(0) invert(1);opacity:.96;
}

.badge{
  display:inline-flex;align-items:center;gap:9px;
  padding:8px 16px;border-radius:999px;
  border:1px solid rgba(255,255,255,.32);background:rgba(255,255,255,.08);
  backdrop-filter:blur(6px);
  font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;
  color:#fff;margin-bottom:24px;
}
.badge i{width:8px;height:8px;border-radius:999px;background:var(--terra-soft);display:block}

h1{
  font-family:var(--font-display);font-weight:400;
  font-size:clamp(54px,13vw,104px);line-height:.98;letter-spacing:.01em;
  margin:0 0 18px;color:#fff;
}
.lead{
  font-size:clamp(15px,2.2vw,18px);line-height:1.6;
  color:rgba(255,255,255,.86);max-width:46ch;margin:0 0 34px;
}

.contacts{display:flex;flex-direction:column;align-items:center;gap:20px;width:100%}
.wa{
  display:inline-flex;align-items:center;gap:10px;
  padding:15px 26px;border-radius:999px;
  background:var(--terra);color:#FFF7F3;text-decoration:none;
  font-weight:600;font-size:15px;
  box-shadow:0 16px 34px rgba(192,108,80,.36);
  transition:transform .2s ease,box-shadow .2s ease;
}
.wa:hover{transform:translateY(-2px);box-shadow:0 20px 42px rgba(192,108,80,.46)}
.wa svg{width:20px;height:20px}

.rows{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 26px;font-size:14px}
.rows a,.rows span{color:rgba(255,255,255,.82);text-decoration:none}
.rows a:hover{color:var(--terra-soft)}
.rows .sep{color:rgba(255,255,255,.3)}

.foot{
  margin-top:44px;font-size:12px;color:rgba(255,255,255,.55);
  display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;align-items:center;
}
.foot a{color:var(--terra-soft);text-decoration:none;font-weight:600}

@media (prefers-reduced-motion: reduce){
  .wa{transition:none}
}
/* iOS não fixa background: evita corte estranho */
@supports (-webkit-touch-callout: none){
  body{background-attachment:scroll}
}
</style>
</head>
<body>

<main class="hero">
  <div class="inner">
    <img class="logo" src="img/logo.png" alt="Instituto Alvia — Educação Especializada">

    <h1>Em breve</h1>

    <p class="lead">
      Estamos preparando o novo site do <strong>Instituto Alvia</strong> — escola particular
      especializada na escolarização de crianças neurodivergentes.
    </p>


    <div class="foot">
      <span>© 2026 Instituto Alvia · Educação Especializada</span>
      <span class="sep">·</span>
      <a href="https://sinal7.com.br" target="_blank" rel="noopener">Sinal7</a>
    </div>
  </div>
</main>

</body>
</html>
